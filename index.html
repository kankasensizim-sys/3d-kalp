<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D Kalpler</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let scene, camera, renderer;
let heartGroup = [];

init();
animate();

function init() {

    // SAHNE
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    // KAMERA
    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.z = 35;

    // RENDERER
    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);

    // IŞIK
    const ambientLight = new THREE.AmbientLight(
        0xffffff,
        1.5
    );

    scene.add(ambientLight);

    // KALP GRUBU
    const heartGeo = new THREE.Shape();

    heartGeo.moveTo(0, 1);

    heartGeo.bezierCurveTo(
        -4, 4,
        -8, 0,
        0, -5
    );

    heartGeo.bezierCurveTo(
        8, 0,
        4, 4,
        0, 1
    );

    const geometry = new THREE.ExtrudeGeometry(
        heartGeo,
        {
            depth: 1.5,
            bevelEnabled: true,
            bevelSegments: 3,
            bevelSize: 0.3,
            bevelThickness: 0.3
        }
    );

    geometry.center();

    // KALP MATERYALİ
    const material = new THREE.MeshStandardMaterial({
        color: 0xff1744,
        emissive: 0x770020,
        emissiveIntensity: 1.2,
        metalness: 0.2,
        roughness: 0.3
    });

    // KALPLERİ OLUŞTUR
    for (let i = 0; i < 35; i++) {

        const heartMesh =
            new THREE.Mesh(
                geometry,
                material.clone()
            );

        heartMesh.userData = {

            radius: 4 + Math.random() * 14,

            angle:
                Math.random() * Math.PI * 2,

            ySpeed:
                0.006 +
                Math.random() * 0.012,

            yOffset:
                (Math.random() - 0.5) * 30,

            rotationSpeed:
                (Math.random() - 0.5) * 0.02
        };

        heartMesh.position.x =
            Math.cos(
                heartMesh.userData.angle
            ) *
            heartMesh.userData.radius;

        heartMesh.position.z =
            Math.sin(
                heartMesh.userData.angle
            ) *
            heartMesh.userData.radius;

        heartMesh.position.y =
            heartMesh.userData.yOffset;

        // Rastgele boyut
        const scale =
            0.25 + Math.random() * 0.7;

        heartMesh.scale.set(
            scale,
            scale,
            scale
        );

        // Rastgele dönüş
        heartMesh.rotation.x =
            Math.random() * Math.PI;

        heartMesh.rotation.y =
            Math.random() * Math.PI;

        scene.add(heartMesh);

        heartGroup.push(heartMesh);
    }

    // TELEFON EKRANI DEĞİŞİNCE
    window.addEventListener(
        "resize",
        onWindowResize
    );
}


// ANİMASYON
function animate() {

    requestAnimationFrame(animate);

    heartGroup.forEach((heart) => {

        // Yukarı doğru hareket
        heart.position.y +=
            heart.userData.ySpeed;

        // Dönüş
        heart.rotation.x +=
            heart.userData.rotationSpeed;

        heart.rotation.y +=
            heart.userData.rotationSpeed;

        // Yukarıdan çıkınca aşağı gönder
        if (heart.position.y > 18) {

            heart.position.y = -18;

            heart.userData.radius =
                4 + Math.random() * 14;

            heart.userData.angle =
                Math.random() * Math.PI * 2;

            heart.position.x =
                Math.cos(
                    heart.userData.angle
                ) *
                heart.userData.radius;

            heart.position.z =
                Math.sin(
                    heart.userData.angle
                ) *
                heart.userData.radius;
        }
    });

    // Kameraya hafif hareket
    camera.position.x =
        Math.sin(Date.now() * 0.0002) * 2;

    camera.lookAt(0, 0, 0);

    renderer.render(
        scene,
        camera
    );
}


// EKRAN BOYUTU
function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

</script>

</body>
</html>
